name: design_lint
description: >-
  Custom analyzer lint rules that enforce the Agora design system: forbid
  hard-coded colors / text styles and steer developers from raw Flutter widgets
  toward their ui_kit counterparts.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  analyzer: ^8.0.0
  custom_lint_builder: ^0.8.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
