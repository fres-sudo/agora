name: lan_hub
description: Embedded LAN sync hub for Agora — HTTP pairing + WebSocket server, mDNS advertise/discover. No cloud, LAN-only.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'

dependencies:
  bonsoir: ^5.1.5
  flutter:
    sdk: flutter
  logger:
    path: ../logger
  result:
    path: ../result
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  sync_engine:
    path: ../sync_engine
  talker: ^5.1.9
  uuid: ^4.5.1
  wakelock_plus: ^1.3.3
  web_socket_channel: ^3.0.2

dev_dependencies:
  build_runner: ^2.4.7
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
