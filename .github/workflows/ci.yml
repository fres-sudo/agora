name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Link FVM-style SDK path for melos
        # melos.yaml pins sdkPath to .fvm/flutter_sdk (normally created by `fvm use`);
        # point it at the SDK installed above so `melos run ...` can find flutter/dart.
        run: |
          mkdir -p .fvm
          ln -s "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Bootstrap melos workspace
        run: dart run melos bootstrap

      - name: Format check
        run: dart run melos run format

      - name: Analyze
        run: dart run melos run lint

      - name: Design lint (custom_lint)
        # Plain `dart analyze` (the "Analyze" step above) does not load analyzer
        # plugins, so this is not redundant with it — see analysis_options.yaml.
        # `continue-on-error` is temporary: enabling this rule set surfaced a
        # handful of pre-existing hard-coded colors elsewhere in the repo
        # (data/seed defaults and a receipt print-preview) that need a design
        # decision — justified `// ignore:` comment or a token refactor —
        # rather than being silenced as part of this fix. Flip this to blocking
        # once that follow-up lands.
        run: dart run melos run lint:design
        continue-on-error: true

      - name: Test
        run: dart run melos run test
