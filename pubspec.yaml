name: agora_workspace
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.38.5"

workspace:
  - apps/agora
  - features/auth
  - features/discounts
  - features/inventory
  - features/orders
  - features/pos
  - features/products
  - features/reports
  - features/settings
  - features/workforce
  - packages/app_info
  - packages/bloc
  - packages/config
  - packages/database
  - packages/design_lint
  - packages/errors
  - packages/feature_flags
  - packages/i18n
  - packages/launcher
  - packages/logger
  - packages/observer
  - packages/printing
  - packages/remote_config
  - packages/result
  - packages/sync_engine
  - packages/ui_kit
  - packages/utils

melos:
  sdkPath: .fvm/flutter_sdk

  command:
    bootstrap:
      usePubspecOverrides: true
    version:
      workspaceChangelog: false

  scripts:
    # -------------------------------------------------------------------------
    # Code generation
    # -------------------------------------------------------------------------
    build:
      description: Run build_runner in all packages (one at a time to avoid conflicts)
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    build:watch:
      description: Watch mode code generation (run per-package, not workspace-wide)
      run: dart run build_runner watch --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    build:features:
      description: Run build_runner in feature packages only
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        scope: "feature_*"

    build:packages:
      description: Run build_runner in shared packages only
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
      packageFilters:
        flutter: true
        ignore:
          - "feature_*"
          - "agora"

    # -------------------------------------------------------------------------
    # Run the app (flavor + env via --dart-define-from-file)
    # -------------------------------------------------------------------------
    run:local:
      description: Run Agora fully offline (free tier, no backend)
      run: cd apps/agora && fvm flutter run --flavor dev --dart-define-from-file=../../config/local.json

    run:dev:
      description: Run Agora against a dev backend (hybrid, all features)
      run: cd apps/agora && fvm flutter run --flavor dev --dart-define-from-file=../../config/dev.json

    run:staging:
      description: Run Agora against the staging backend (hybrid)
      run: cd apps/agora && fvm flutter run --flavor staging --dart-define-from-file=../../config/staging.json

    run:prod:
      description: Run Agora against the production backend
      run: cd apps/agora && fvm flutter run --flavor prod --dart-define-from-file=../../config/prod.json

    # -------------------------------------------------------------------------
    # Testing
    # -------------------------------------------------------------------------
    test:
      description: Run all tests across packages
      run: flutter test --coverage
      exec:
        concurrency: 4
        failFast: false
      packageFilters:
        flutter: true
        dirExists: test

    test:features:
      description: Run tests in feature packages only
      run: flutter test
      exec:
        concurrency: 4
      packageFilters:
        flutter: true
        dirExists: test
        scope: "feature_*"

    test:packages:
      description: Run tests in shared packages only
      run: flutter test
      exec:
        concurrency: 4
      packageFilters:
        dirExists: test
        ignore:
          - "feature_*"
          - "agora"

    # -------------------------------------------------------------------------
    # Quality
    # -------------------------------------------------------------------------
    lint:
      description: Run dart analyze in all packages
      run: dart analyze . --fatal-infos
      exec:
        concurrency: 6

    lint:design:
      description: >-
        Enforce the design-system rules (design_lint via custom_lint): no
        hard-coded colors/text styles, prefer AppText/AppTextField/AppButton
        over the raw Material widgets. Runs once at the workspace root.
      run: dart run custom_lint
      # NOTE: intentionally NOT part of `check`/`ci` yet — there is pre-existing
      # tech debt to migrate first. Promote it into those gates once the
      # workspace is clean (or once violations are ratcheted down).

    format:
      description: Check formatting of all Dart files (fails if changes needed — use format:fix to apply)
      run: dart format lib test --set-exit-if-changed
      exec:
        concurrency: 6

    format:fix:
      description: Format all Dart files and apply changes in place
      run: dart format lib test
      exec:
        concurrency: 6

    fix:
      description: Apply dart fix suggestions across all packages
      run: dart fix --apply
      exec:
        concurrency: 1

    # Composite quality gates — steps run sequentially
    check:
      description: Fast quality gate — format check + lint (no tests)
      steps:
        - format
        - lint

    ci:
      description: Full CI quality gate — format + lint + test
      steps:
        - format
        - lint
        - test

    # -------------------------------------------------------------------------
    # Maintenance
    # -------------------------------------------------------------------------
    clean:
      description: flutter clean in all packages
      run: flutter clean
      exec:
        concurrency: 6
      packageFilters:
        flutter: true

    upgrade:
      description: flutter pub upgrade in all packages
      run: flutter pub upgrade
      exec:
        concurrency: 1
      packageFilters:
        flutter: true

    outdated:
      description: Check for outdated dependencies across all packages
      run: flutter pub outdated
      exec:
        concurrency: 4
      packageFilters:
        flutter: true

    deps:
      description: Print dependency graph
      run: dart pub deps
      exec:
        concurrency: 6

dependencies:
  database:
    path: packages/database
  drift: ^2.30.0
  feature_discounts:
    path: features/discounts
  feature_inventory:
    path: features/inventory
  feature_orders:
    path: features/orders
  feature_pos:
    path: features/pos
  feature_products:
    path: features/products
  feature_reports:
    path: features/reports
  feature_settings:
    path: features/settings
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  mocktail: ^1.0.4
  printing:
    path: packages/printing
  result:
    path: packages/result

dev_dependencies:
  auto_route_generator: ^10.2.6
  bloc_test: ^10.0.0
  build: ^3.0.0
  build_runner: ^2.4.7
  custom_lint: ^0.8.1
  data_fixture_dart: ^3.0.0
  design_lint:
    path: packages/design_lint
  drift_dev: ^2.30.0
  flutter_gen_runner:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  lints: ^6.0.0
  melos: ^7.4.0
  mockito: ^5.5.0
  slang_build_runner: ^4.10.0
  test: ^1.24.0
