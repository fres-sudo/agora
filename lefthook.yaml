pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: fvm flutter format --set-exit-if-changed .
    analyze:
      glob: "*.dart"
      run: dart analyze . --fatal-infos

pre-push:
  parallel: true
  commands:
    test:
      glob: "*.dart"
      run: fvm dart run melos run test
